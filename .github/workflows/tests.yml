name: Surveillance regression tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt
            requirements-agent.txt
      - run: python -m pip install -r requirements.txt -r requirements-agent.txt
      - run: python -m pytest -q
